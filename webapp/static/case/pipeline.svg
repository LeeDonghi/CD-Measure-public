<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" width="720" height="242" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="판독 파이프라인 6단계">
<rect x="0" y="0" width="214" height="104" rx="7" fill="#ffffff" stroke="#d8dee4"/><rect x="14" y="14" width="21" height="21" rx="4" fill="#e7eef4" stroke="#cfdce6"/><text x="24.5" y="29" font-size="12" fill="#1c3f5f" text-anchor="middle" font-family="Consolas, monospace">1</text><text x="44" y="30" font-size="14.5" font-weight="700" fill="#16212b">마스크 추출</text><text x="15" y="60" font-size="12" fill="#5c6b78">밝기 임계값을 낮은 값부터</text><text x="15" y="79" font-size="12" fill="#5c6b78">올려가며 글자 후보를 찾음</text>
<path d="M218 52.0 h10" stroke="#8d99a4" stroke-width="1.6"/><path d="M227 48.0 l5 4 -5 4z" fill="#8d99a4"/>
<rect x="236" y="0" width="214" height="104" rx="7" fill="#ffffff" stroke="#d8dee4"/><rect x="250" y="14" width="21" height="21" rx="4" fill="#e7eef4" stroke="#cfdce6"/><text x="260.5" y="29" font-size="12" fill="#1c3f5f" text-anchor="middle" font-family="Consolas, monospace">2</text><text x="280" y="30" font-size="14.5" font-weight="700" fill="#16212b">줄 박스 검출</text><text x="251" y="60" font-size="12" fill="#5c6b78">흰 픽셀 덩어리를</text><text x="251" y="79" font-size="12" fill="#5c6b78">측정줄 단위로 묶음</text>
<path d="M454 52.0 h10" stroke="#8d99a4" stroke-width="1.6"/><path d="M463 48.0 l5 4 -5 4z" fill="#8d99a4"/>
<rect x="472" y="0" width="214" height="104" rx="7" fill="#ffffff" stroke="#d8dee4"/><rect x="486" y="14" width="21" height="21" rx="4" fill="#e7eef4" stroke="#cfdce6"/><text x="496.5" y="29" font-size="12" fill="#1c3f5f" text-anchor="middle" font-family="Consolas, monospace">3</text><text x="516" y="30" font-size="14.5" font-weight="700" fill="#16212b">글자 분할</text><text x="487" y="60" font-size="12" fill="#5c6b78">세로 투영으로</text><text x="487" y="79" font-size="12" fill="#5c6b78">글자 하나씩 자름</text>
<rect x="0" y="138" width="214" height="104" rx="7" fill="#ffffff" stroke="#d8dee4"/><rect x="14" y="152" width="21" height="21" rx="4" fill="#e7eef4" stroke="#cfdce6"/><text x="24.5" y="167" font-size="12" fill="#1c3f5f" text-anchor="middle" font-family="Consolas, monospace">4</text><text x="44" y="168" font-size="14.5" font-weight="700" fill="#16212b">템플릿 매칭</text><text x="15" y="198" font-size="12" fill="#5c6b78">16종 비트맵과 비교해</text><text x="15" y="217" font-size="12" fill="#5c6b78">가장 비슷한 글자로 분류</text>
<path d="M218 190.0 h10" stroke="#8d99a4" stroke-width="1.6"/><path d="M227 186.0 l5 4 -5 4z" fill="#8d99a4"/>
<rect x="236" y="138" width="214" height="104" rx="7" fill="#ffffff" stroke="#d8dee4"/><rect x="250" y="152" width="21" height="21" rx="4" fill="#e7eef4" stroke="#cfdce6"/><text x="260.5" y="167" font-size="12" fill="#1c3f5f" text-anchor="middle" font-family="Consolas, monospace">5</text><text x="280" y="168" font-size="14.5" font-weight="700" fill="#16212b">형식 파싱</text><text x="251" y="198" font-size="12" fill="#5c6b78">정규식으로</text><text x="251" y="217" font-size="12" fill="#5c6b78">번호·값·X·Y 추출</text>
<path d="M454 190.0 h10" stroke="#8d99a4" stroke-width="1.6"/><path d="M463 186.0 l5 4 -5 4z" fill="#8d99a4"/>
<rect x="472" y="138" width="214" height="104" rx="7" fill="#ffffff" stroke="#d8dee4"/><rect x="486" y="152" width="21" height="21" rx="4" fill="#e7eef4" stroke="#cfdce6"/><text x="496.5" y="167" font-size="12" fill="#1c3f5f" text-anchor="middle" font-family="Consolas, monospace">6</text><text x="516" y="168" font-size="14.5" font-weight="700" fill="#16212b">교차검증</text><text x="487" y="198" font-size="12" fill="#5c6b78">값 = √(X²+Y²) 로</text><text x="487" y="217" font-size="12" fill="#5c6b78">스스로 확인</text>
<path d="M666 104 v14 q0 8 -8 8 H28 q-8 0 -8 8 v14" fill="none" stroke="#8d99a4" stroke-width="1.6" stroke-dasharray="3 3"/><path d="M16 133 l4 6 4 -6z" fill="#8d99a4"/>
</svg>
